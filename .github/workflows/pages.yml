name: Déployer sur GitHub Pages

# =====================================================================
# UNE SEULE BRANCHE PUBLIE, ET CE N'EST PAS UN OUBLI.
#
# L'environnement `github-pages` n'accepte QUE la branche configurée comme
# source des Pages. Lancé depuis n'importe quelle autre, le job est rejeté
# par les règles de protection de l'environnement : il échoue en deux
# secondes, avant même le premier pas, et envoie un mail « run failed ».
#
# Publier, c'est donc avancer la branche nommée ci-dessous — pas ajouter
# sa branche de travail ici. Elle apparaît à deux endroits, le filtre de
# `push` et le test du job : changer l'une sans l'autre ne casse rien, ça
# rend seulement le garde-fou inutile.
# =====================================================================
on:
  push:
    branches: ["claude/turn-based-mmorpg-game-kb73gi"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deployer:
    # Ceinture ET bretelles. Le filtre de branches ci-dessus couvre les
    # poussées ; ce test-ci couvre le reste — un lancement manuel
    # (`workflow_dispatch`) depuis une branche de travail, ou une relance
    # d'un vieux run. Sans lui, ces deux cas repartent droit dans le mur
    # de l'environnement et repeignent l'historique en rouge. Avec lui, le
    # job est simplement IGNORÉ : gris, pas rouge, et pas de mail.
    if: github.ref == format('refs/heads/{0}', 'claude/turn-based-mmorpg-game-kb73gi')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
