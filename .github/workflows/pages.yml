name: Déployer sur GitHub Pages

# Une seule branche déclenche le déploiement, et c'est voulu :
# l'environnement `github-pages` n'accepte QUE la branche configurée comme
# source des Pages. Une autre branche ici ne déploie rien — elle échoue en
# deux secondes, avant même le premier pas, et envoie un mail « run
# failed » à chaque poussée. Pour publier, on avance cette branche-là.
on:
  push:
    branches: ["claude/turn-based-mmorpg-game-kb73gi"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
